name: Daily Instagram Reel post

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 21:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 1. 投稿できる動画が少なければ、台本(script_queue/)から動画を作る ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 作る必要がある日だけ FFmpeg 等を入れる（インストールに時間がかかるため）
      - name: Check if rendering is needed
        id: need
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          m = json.load(open("posts/manifest.json", encoding="utf-8"))
          known = {p["slug"] for p in m["posts"]}
          ready = sum(p["status"] == "ready" for p in m["posts"])
          pending = [f for f in glob.glob("script_queue/*.json")
                     if json.load(open(f, encoding="utf-8"))["video_slug"] not in known]
          print("render=" + ("true" if ready < 2 and pending else "false"))
          if ready == 0 and not pending:
              import sys
              print("::error::投稿できる動画も台本もありません。script_queue/ に台本を追加してください。", file=sys.stderr)
              sys.exit(3)
          PY

      - name: Install FFmpeg and Japanese font
        if: steps.need.outputs.render == 'true'
        run: |
          # man-db の索引更新を止めると apt が大幅に速くなる
          sudo rm -f /var/lib/man-db/auto-update
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
          pip install -q -r generator/requirements.txt

      - name: Render videos from script queue
        if: steps.need.outputs.render == 'true'
        id: render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
        run: python generator/render_next.py

      - name: Commit rendered videos
        run: |
          git add videos posts/manifest.json script_queue
          if git diff --cached --quiet; then
            echo "新しく作った動画はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render reels from script queue (GitHub Actions)"
          git pull --rebase
          git push
          # 直前にpushした動画が raw.githubusercontent.com から読めるまで少し待つ
          sleep 60

      # ---- 2. ready の中で一番若い1本を投稿する ----
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post Reel to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GITHUB_RAW_BASE: ${{ secrets.GITHUB_RAW_BASE || format('https://raw.githubusercontent.com/{0}/main', github.repository) }}
        run: node scripts/post-reel-to-instagram.js

      - name: Commit manifest
        run: |
          if git diff --quiet posts/manifest.json; then
            echo "manifest.json に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/manifest.json
          git commit -m "Mark reel as posted (GitHub Actions)"
          git pull --rebase
          git push
